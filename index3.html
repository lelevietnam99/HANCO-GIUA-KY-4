<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Hán Cổ - Trang 3: Từ Vựng (Gia - Mộc)</title>
    <style>
        :root {
            --bg-color: #0B0D1B;
            --card-bg: rgba(20, 24, 48, 0.9);
            --card-border: rgba(120, 140, 255, 0.3);
            --accent-glow: #7B61FF;
            --neon-blue: #00F0FF;
            --neon-purple: #D000FF;
            --text-main: #E2E8F0;
            --text-sub: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at bottom, #111827 0%, #050714 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(2px 2px at 25px 35px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 90px, #D000FF, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 110px 45px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 140px, #00F0FF, rgba(0,0,0,0));
            background-size: 230px 230px;
            opacity: 0.7;
        }

        .container {
            max-width: 950px;
            width: 100%;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(123, 97, 255, 0.2);
        }

        header h1 {
            font-size: 1.8rem;
            color: #FFF;
            text-shadow: 0 0 12px var(--accent-glow);
            margin-bottom: 8px;
        }

        header p {
            color: var(--neon-blue);
            font-size: 0.95rem;
        }

        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-glow);
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px var(--accent-glow);
            color: #FFF;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: rgba(10, 14, 30, 0.8);
            color: #FFF;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Flashcard Section */
        .card-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 380px;
            height: 260px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
        }

        .card-front {
            font-size: 4.5rem;
            color: #FFF;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .card-front span.hint {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 12px;
        }

        .card-back {
            transform: rotateY(180deg);
            background: rgba(12, 17, 38, 0.98);
            text-align: left;
            align-items: flex-start;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .card-back .pinyin {
            font-size: 1.3rem;
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
            width: 100%;
            padding-bottom: 6px;
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .card-back .details {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .card-nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: #FFF;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: var(--accent-glow);
            border-color: var(--accent-glow);
        }

        /* List View */
        .list-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vocab-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: 90px 150px 1fr;
            gap: 15px;
            align-items: center;
            transition: 0.2s;
        }

        .vocab-row:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.15);
        }

        .list-hanzi {
            font-size: 2rem;
            color: #FFF;
            text-align: center;
        }

        .list-meaning {
            font-size: 1.1rem;
            color: var(--neon-blue);
            font-weight: 600;
        }

        .list-explanation {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <header>
            <h1>HÁN CỔ - ÔN TẬP GIỮA KỲ IV</h1>
            <p>Trang 3: Phân Tích Từ Vựng & Bộ Thủ (Gia - Mộc)</p>
        </header>

        <div class="controls-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('cards')">🃏 Thẻ Ghi Nhớ (Flashcard)</button>
                <button class="tab-btn" onclick="switchTab('list')">📋 Danh Sách Chi Tiết</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm Chữ Hán hoặc Nghĩa..." oninput="handleSearch()">
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="cardsSection" class="card-view">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="flashcard-inner">
                    <div class="card-front">
                        <span id="cardHanzi">家景</span>
                        <span class="hint">(Nhấn để lật xem nghĩa & phân tích)</span>
                    </div>
                    <div class="card-back">
                        <div class="pinyin" id="cardMeaning">Phiên âm: gia cảnh</div>
                        <div class="details" id="cardDetails">Chi tiết bộ thủ và ý nghĩa...</div>
                    </div>
                </div>
            </div>

            <div class="card-nav">
                <button class="action-btn" onclick="prevCard(event)">⬅️ Trước</button>
                <span id="cardProgress" style="color: var(--neon-blue); font-weight: bold;">1 / 25</span>
                <button class="action-btn" onclick="nextCard(event)">Sau ➡️</button>
                <button class="action-btn" onclick="randomCard(event)">🔀 Ngẫu nhiên</button>
            </div>
        </div>

        <!-- List Section -->
        <div id="listSection" style="display: none;">
            <div class="list-view" id="vocabList"></div>
        </div>

        <footer>
            Học tập hiệu quả • Kiến thức Vũ trụ Hán Cổ 🌌
        </footer>
    </div>

    <script>
        const vocabData = [
            { hanzi: "家景", meaning: "gia cảnh", components: "Bộ Miên (宀 - nhà) + Bộ Nhật (日 - ánh sáng)", explanation: "Gia (nhà cửa) + Cảnh (hoàn cảnh, phong cảnh). Hoàn cảnh kinh tế hoặc tình hình gia đình." },
            { hanzi: "家風", meaning: "gia phong", components: "Bộ Miên (宀) + Bộ Phong (風 - gió/nếp sống)", explanation: "Nếp sống, truyền thống đạo đức tốt đẹp được giữ gìn qua nhiều thế hệ trong gia đình." },
            { hanzi: "家書", meaning: "gia thư", components: "Bộ Miên (宀) + Bộ Viết (曰 / 書 - thư từ)", explanation: "Thư từ từ quê nhà gửi đi hoặc thư gửi về cho người thân trong gia đình." },
            { hanzi: "家長", meaning: "gia trưởng", components: "Bộ Miên (宀) + Bộ Trường (長 - người lớn)", explanation: "Người chủ, người đại diện có quyền quyết định lớn nhất trong gia đình." },
            { hanzi: "河伯", meaning: "Hà bá", components: "Bộ Thủy (氵) + Bộ Nhân (亻/白)", explanation: "Vị thần coi quản sông nước theo thần thoại cổ xưa." },
            { hanzi: "夏至", meaning: "hạ chí", components: "Bộ Hạ (夏) + Bộ Chí (至)", explanation: "Tiết khí hạ chí (ngày giữa mùa hè có khoảng thời gian ban ngày dài nhất trong năm)." },
            { hanzi: "荷花", meaning: "hà hoa", components: "Bộ Thảo (艹) + Bộ Thảo (艹)", explanation: "Bông hoa sen thanh cao 'gần bùn mà chẳng hôi hèn mùi bùn'." },
            { hanzi: "河內", meaning: "Hà Nội", components: "Bộ Thủy (氵) + Bộ Nội (內)", explanation: "Vùng đất nằm bên trong các dòng sông (Thủ đô Hà Nội của Việt Nam)." },
            { hanzi: "行李", meaning: "hành lý", components: "Bộ Hành (行) + Bộ Lý (李)", explanation: "Đồ đạc mang theo người khi đi xa, du ngoạn." },
            { hanzi: "形容", meaning: "hình dung", components: "Bộ Hình (形) + Bộ Bát/Dung (容)", explanation: "Mô tả, miêu tả lại dáng vẻ, đặc điểm của sự vật hay hiện tượng." },
            { hanzi: "護照", meaning: "hộ chiếu", components: "Bộ Ngôn (言) + Bộ Nhật (日)", explanation: "Giấy tờ chứng nhận danh tính do nhà nước cấp để đi lại giữa các quốc gia." },
            { hanzi: "和平", meaning: "hoà bình", components: "Bộ Hòa (和) + Bộ Bình (平)", explanation: "Trạng thái yên bình, không có chiến tranh, xung đột." },
            { hanzi: "和尚", meaning: "hoà thượng", components: "Bộ Hòa (和) + Bộ Thượng (尚)", explanation: "Danh xưng tôn kính trong Phật giáo dành cho vị Tăng sĩ tu hành lâu năm, đức cao trọng vọng." },
            { hanzi: "黃牛", meaning: "hoàng ngưu", components: "Bộ Hoàng (黃) + Bộ Ngưu (牛)", explanation: "Con bò vàng, loài vật siêng năng gắn liền với công việc canh nông." },
            { hanzi: "悔過", meaning: "hối quá", components: "Bộ Tâm (忄) + Bộ Sước (辶)", explanation: "Ăn ăn, hối hận và sửa chữa những sai lầm đã phạm phải." },
            { hanzi: "向善", meaning: "hướng thiện", components: "Bộ Hướng (向) + Bộ Khẩu/Thiện (善)", explanation: "Hướng tâm trí và hành động về điều tốt lành, đạo đức." },
            { hanzi: "希望", meaning: "hy vọng", components: "Bộ Cân (巾) + Bộ Nguyệt (望)", explanation: "Mong mỏi, trông chờ vào những điều tốt đẹp trong tương lai." },
            { hanzi: "可能", meaning: "khả năng", components: "Bộ Khẩu (口) + Bộ Năng (能)", explanation: "Năng lực, điều kiện có thể thực hiện hoặc xảy ra." },
            { hanzi: "客店", meaning: "khách điếm", components: "Bộ Miên (宀) + Bộ Nghiễm (廣)", explanation: "Quán trọ thời xưa dành cho khách phương xa dừng chân nghỉ ngơi." },
            { hanzi: "孔子", meaning: "Khổng Tử", components: "Bộ Tử (子) + Bộ Tử (子)", explanation: "Nhà triết học, người sáng lập ra Nho giáo thời Cổ đại." },
            { hanzi: "京城", meaning: "kinh thành", components: "Bộ Đầu (亠) + Bộ Thành (城)", explanation: "Thành quách nơi vua ở và đặt trung tâm bộ máy triều đình." },
            { hanzi: "禮拜", meaning: "lễ bái", components: "Bộ Thị (礻) + Bộ Thủ (手)", explanation: "Chắp tay, kính cẩn nghiêng mình cúng bái Phật, Thần, Thánh." },
            { hanzi: "論語", meaning: "Luận Ngữ", components: "Bộ Ngôn (言) + Bộ Ngôn (言)", explanation: "Bộ sách kinh điển ghi lại lời dạy của Khổng Tử và các đệ tử." },
            { hanzi: "孟子", meaning: "Mạnh Tử", components: "Bộ Tử (子) + Bộ Tử (子)", explanation: "Bậc Thánh triết Nho gia tiếp nối và phát triển tư tưởng Khổng Tử." },
            { hanzi: "木魚", meaning: "mộc ngư", components: "Bộ Mộc (木) + Bộ Ngư (魚)", explanation: "Mõ gỗ dùng trong nghi lễ tụng kinh Phật giáo (mắt cá không bao giờ nhắm, nhắc nhở người tu luôn tỉnh thức)." }
        ];

        let currentIndex = 0;
        let filteredData = [...vocabData];

        function updateCardView() {
            if (filteredData.length === 0) return;
            const item = filteredData[currentIndex];
            document.getElementById("cardHanzi").innerText = item.hanzi;
            document.getElementById("cardMeaning").innerText = `Phiên âm: ${item.meaning}`;
            document.getElementById("cardDetails").innerHTML = `<b>Cấu tạo bộ thủ:</b> ${item.components}<br><br><b>Ý nghĩa sâu xa:</b> ${item.explanation}`;
            document.getElementById("cardProgress").innerText = `${currentIndex + 1} / ${filteredData.length}`;
            document.getElementById("flashcard").classList.remove("flipped");
        }

        function flipCard() {
            document.getElementById("flashcard").classList.toggle("flipped");
        }

        function nextCard(event) {
            if(event) event.stopPropagation();
            if (currentIndex < filteredData.length - 1) {
                currentIndex++;
                updateCardView();
            }
        }

        function prevCard(event) {
            if(event) event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                updateCardView();
            }
        }

        function randomCard(event) {
            if(event) event.stopPropagation();
            currentIndex = Math.floor(Math.random() * filteredData.length);
            updateCardView();
        }

        function renderList() {
            const listContainer = document.getElementById("vocabList");
            listContainer.innerHTML = "";
            filteredData.forEach((item) => {
                const div = document.createElement("div");
                div.className = "vocab-row";
                div.innerHTML = `
                    <div class="list-hanzi">${item.hanzi}</div>
                    <div class="list-meaning">${item.meaning}</div>
                    <div class="list-explanation"><b>Bộ cấu thành:</b> ${item.components}<br><b>Ý nghĩa:</b> ${item.explanation}</div>
                `;
                listContainer.appendChild(div);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            if (tab === 'cards') {
                document.querySelectorAll(".tab-btn")[0].classList.add("active");
                document.getElementById("cardsSection").style.display = "flex";
                document.getElementById("listSection").style.display = "none";
            } else {
                document.querySelectorAll(".tab-btn")[1].classList.add("active");
                document.getElementById("cardsSection").style.display = "none";
                document.getElementById("listSection").style.display = "block";
                renderList();
            }
        }

        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            filteredData = vocabData.filter(item => 
                item.hanzi.includes(query) || item.meaning.toLowerCase().includes(query) || item.explanation.toLowerCase().includes(query)
            );
            currentIndex = 0;
            updateCardView();
            renderList();
        }

        updateCardView();
    </script>
</body>
</html>
