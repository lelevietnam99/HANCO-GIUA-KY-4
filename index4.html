<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Hán Cổ - Trang 4: Từ Vựng (Nam - Y)</title>
    <style>
        :root {
            --bg-color: #0B0D1B;
            --card-bg: rgba(20, 24, 48, 0.9);
            --card-border: rgba(120, 140, 255, 0.3);
            --accent-glow: #7B61FF;
            --neon-blue: #00F0FF;
            --neon-purple: #D000FF;
            --text-main: #E2E8F0;
            --text-sub: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at bottom, #111827 0%, #050714 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(2px 2px at 30px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 70px 100px, #D000FF, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 120px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 190px 150px, #00F0FF, rgba(0,0,0,0));
            background-size: 240px 240px;
            opacity: 0.7;
        }

        .container {
            max-width: 950px;
            width: 100%;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(123, 97, 255, 0.2);
        }

        header h1 {
            font-size: 1.8rem;
            color: #FFF;
            text-shadow: 0 0 12px var(--accent-glow);
            margin-bottom: 8px;
        }

        header p {
            color: var(--neon-blue);
            font-size: 0.95rem;
        }

        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-glow);
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px var(--accent-glow);
            color: #FFF;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: rgba(10, 14, 30, 0.8);
            color: #FFF;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Flashcard Section */
        .card-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 380px;
            height: 260px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
        }

        .card-front {
            font-size: 4.5rem;
            color: #FFF;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .card-front span.hint {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 12px;
        }

        .card-back {
            transform: rotateY(180deg);
            background: rgba(12, 17, 38, 0.98);
            text-align: left;
            align-items: flex-start;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .card-back .pinyin {
            font-size: 1.3rem;
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
            width: 100%;
            padding-bottom: 6px;
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .card-back .details {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .card-nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: #FFF;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: var(--accent-glow);
            border-color: var(--accent-glow);
        }

        /* List View */
        .list-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vocab-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: 90px 150px 1fr;
            gap: 15px;
            align-items: center;
            transition: 0.2s;
        }

        .vocab-row:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.15);
        }

        .list-hanzi {
            font-size: 2rem;
            color: #FFF;
            text-align: center;
        }

        .list-meaning {
            font-size: 1.1rem;
            color: var(--neon-blue);
            font-weight: 600;
        }

        .list-explanation {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <header>
            <h1>HÁN CỔ - ÔN TẬP GIỮA KỲ IV</h1>
            <p>Trang 4: Phân Tích Từ Vựng & Bộ Thủ (Nam - Y)</p>
        </header>

        <div class="controls-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('cards')">🃏 Thẻ Ghi Nhớ (Flashcard)</button>
                <button class="tab-btn" onclick="switchTab('list')">📋 Danh Sách Chi Tiết</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm Chữ Hán hoặc Nghĩa..." oninput="handleSearch()">
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="cardsSection" class="card-view">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="flashcard-inner">
                    <div class="card-front">
                        <span id="cardHanzi">南哀</span>
                        <span class="hint">(Nhấn để lật xem nghĩa & phân tích)</span>
                    </div>
                    <div class="card-back">
                        <div class="pinyin" id="cardMeaning">Phiên âm: Nam Ai</div>
                        <div class="details" id="cardDetails">Chi tiết bộ thủ và ý nghĩa...</div>
                    </div>
                </div>
            </div>

            <div class="card-nav">
                <button class="action-btn" onclick="prevCard(event)">⬅️ Trước</button>
                <span id="cardProgress" style="color: var(--neon-blue); font-weight: bold;">1 / 25</span>
                <button class="action-btn" onclick="nextCard(event)">Sau ➡️</button>
                <button class="action-btn" onclick="randomCard(event)">🔀 Ngẫu nhiên</button>
            </div>
        </div>

        <!-- List Section -->
        <div id="listSection" style="display: none;">
            <div class="list-view" id="vocabList"></div>
        </div>

        <footer>
            Học tập hiệu quả • Hoàn thành Từ vựng Hán Cổ 🌌
        </footer>
    </div>

    <script>
        const vocabData = [
            { hanzi: "南哀", meaning: "Nam Ai", components: "Bộ Thập (十) + Bộ Khẩu (口)", explanation: "Nam (phương Nam) + Ai (bi ai, u buồn). Điệu nhạc/làn điệu âm nhạc truyền thống mang giai điệu buồn bả, trầm lắng của phương Nam." },
            { hanzi: "願望", meaning: "nguyện vọng", components: "Bộ Tr页 (頁) + Bộ Nguyệt (望)", explanation: "Nguyện (lòng mong ước) + Vọng (trông chờ). Ước mơ, hoài hoài châm ngôn hướng tới điều tốt đẹp." },
            { hanzi: "月食", meaning: "nguyệt thực", components: "Bộ Nguyệt (月) + Bộ Thực (食)", explanation: "Hiện tượng Trái Đất che khuất ánh sáng Mặt Trời chiếu đến Mặt Trăng (Mặt Trăng bị ăn)." },
            { hanzi: "內在", meaning: "nội tại", components: "Bộ Nội (內) + Bộ Tự (在)", explanation: "Bản chất ẩn chứa bên trong của sự vật, con người, không phụ thuộc vào yếu tố bên ngoài." },
            { hanzi: "農民", meaning: "nông dân", components: "Bộ Thần (辰) + Bộ Dân (民)", explanation: "Người làm nghề nông nghiệp, cày cấy canh tác trên đồng ruộng." },
            { hanzi: "犯戒", meaning: "phạm giới", components: "Bộ Khuyển (犭) + Bộ Qua (戈)", explanation: "Phạm (vi phạm, bước qua) + Giới (ranh giới, giới luật). Vi phạm các quy tắc đạo đức, giới luật Phật giáo." },
            { hanzi: "佛心", meaning: "Phật tâm", components: "Bộ Nhân (亻) + Bộ Tâm (心)", explanation: "Lòng Phật - tấm lòng từ bi, hỷ xả, rộng mở thương yêu muôn loài chúng sinh." },
            { hanzi: "佛子", meaning: "Phật tử", components: "Bộ Nhân (亻) + Bộ Tử (子)", explanation: "Người con của Phật - những người quy y Tam Bảo, học tập và làm theo lời Phật dạy." },
            { hanzi: "懺悔", meaning: "sám hối", components: "Bộ Tâm (忄) + Bộ Tâm (忄)", explanation: "Sám (tỏ bày lỗi lầm quá khứ) + Hối (ăn ăn, hứa không tái phạm). Nghi thức thanh lọc tâm thức trong Phật giáo." },
            { hanzi: "三寶", meaning: "Tam Bảo", components: "Bộ Tam (三) + Bộ Miên/Bảo (寶)", explanation: "Ba ngôi báu vô giá trong Phật giáo: Phật (Đấng Giác Ngộ), Pháp (Lời dạy chân lý), Tăng (Đoàn đoàn tu hành)." },
            { hanzi: "三世", meaning: "tam thế", components: "Bộ Tam (三) + Bộ Thế (世)", explanation: "Ba thời gian trong dòng chảy nghiệp thức: Quá khứ, Hiện tại và Vị lai (Tương lai)." },
            { hanzi: "成功", meaning: "thành công", components: "Bộ Thành (成) + Bộ Công (工)", explanation: "Đạt được mục tiêu, gặt hái kết quả viên mãn sau quá trình nỗ lực." },
            { hanzi: "清淨", meaning: "thanh tịnh", components: "Bộ Thủy (氵) + Bộ Thủy (氵)", explanation: "Trong sạch, lắng tĩnh, không bị vẩn đục bởi phiền não và tham cúng ái dục." },
            { hanzi: "天氣", meaning: "thiên khí", components: "Bộ Thiên (天) + Bộ Khí (氣)", explanation: "Thời tiết, khí tiết của trời đất biến đổi theo từng mùa." },
            { hanzi: "坐禪", meaning: "toạ thiền", components: "Bộ Thổ (土) + Bộ Thị (礻)", explanation: "Ngồi tĩnh lặng, tập trung tâm trí quan sát hơi thở và thực tại để phát sinh trí tuệ." },
            { hanzi: "齋戒", meaning: "trai giới", components: "Bộ Tề (齊) + Bộ Qua (戈)", explanation: "Giữ mình trong sạch, ăn chay, thanh lọc thân tâm để thực hành nghi lễ thiêng liêng." },
            { hanzi: "住持", meaning: "Trụ Trì", components: "Bộ Nhân (亻) + Bộ Thủ (扌)", explanation: "Trụ (ở lại) + Trì (gìn giữ). Vị Tăng sĩ chịu trách nhiệm quản lý, gìn giữ và phát triển ngôi chùa." },
            { hanzi: "修行", meaning: "tu hành", components: "Bộ Nhân (亻) + Bộ Hành (行)", explanation: "Tu (sửa đổi lỗi lầm) + Hành (thực hành). Quá trình sửa mình và rèn luyện đạo đức theo chân lý." },
            { hanzi: "無常", meaning: "vô thường", components: "Bộ Vô (無) + Bộ Cân (巾)", explanation: "Sự thay đổi liên tục, không có gì tồn tại vĩnh viễn hay cố định (quy luật cốt lõi Phật giáo)." },
            { hanzi: "趨向", meaning: "xu hướng", components: "Bộ Tẩu (走) + Bộ Hướng (向)", explanation: "Chiều hướng, xu thế phát triển hay thiên hướng vận động của sự vật." },
            { hanzi: "出家", meaning: "xuất gia", components: "Bộ Khảm (凵) + Bộ Miên (宀)", explanation: "Rời bỏ gia đình phiền não trần thế để bước vào con đường tu hành giải thoát." },
            { hanzi: "衣鉢", meaning: "y bát", components: "Bộ Y (衣) + Bộ Phụ (金/缽)", explanation: "Áo cà-sa và bình bát - hai vật dụng thiết yếu của người tu sĩ, tượng trưng cho sự truyền thừa tâm pháp." },
            { hanzi: "意向", meaning: "ý hướng", components: "Bộ Tâm (心) + Bộ Hướng (向)", explanation: "Ý định, phương hướng tâm trí muốn đạt tới." },
            { hanzi: "衣服", meaning: "y phục", components: "Bộ Y (衣) + Bộ Nguyệt (服)", explanation: "Trang phục, quần áo che thân và giữ gìn sự trang nghiêm." },
            { hanzi: "衣食", meaning: "y thực", components: "Bộ Y (衣) + Bộ Thực (食)", explanation: "Cơm ăn áo mặc - những nhu cầu vật chất căn bản nhất trong đời sống con người." }
        ];

        let currentIndex = 0;
        let filteredData = [...vocabData];

        function updateCardView() {
            if (filteredData.length === 0) return;
            const item = filteredData[currentIndex];
            document.getElementById("cardHanzi").innerText = item.hanzi;
            document.getElementById("cardMeaning").innerText = `Phiên âm: ${item.meaning}`;
            document.getElementById("cardDetails").innerHTML = `<b>Cấu tạo bộ thủ:</b> ${item.components}<br><br><b>Ý nghĩa sâu xa:</b> ${item.explanation}`;
            document.getElementById("cardProgress").innerText = `${currentIndex + 1} / ${filteredData.length}`;
            document.getElementById("flashcard").classList.remove("flipped");
        }

        function flipCard() {
            document.getElementById("flashcard").classList.toggle("flipped");
        }

        function nextCard(event) {
            if(event) event.stopPropagation();
            if (currentIndex < filteredData.length - 1) {
                currentIndex++;
                updateCardView();
            }
        }

        function prevCard(event) {
            if(event) event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                updateCardView();
            }
        }

        function randomCard(event) {
            if(event) event.stopPropagation();
            currentIndex = Math.floor(Math.random() * filteredData.length);
            updateCardView();
        }

        function renderList() {
            const listContainer = document.getElementById("vocabList");
            listContainer.innerHTML = "";
            filteredData.forEach((item) => {
                const div = document.createElement("div");
                div.className = "vocab-row";
                div.innerHTML = `
                    <div class="list-hanzi">${item.hanzi}</div>
                    <div class="list-meaning">${item.meaning}</div>
                    <div class="list-explanation"><b>Bộ cấu thành:</b> ${item.components}<br><b>Ý nghĩa:</b> ${item.explanation}</div>
                `;
                listContainer.appendChild(div);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            if (tab === 'cards') {
                document.querySelectorAll(".tab-btn")[0].classList.add("active");
                document.getElementById("cardsSection").style.display = "flex";
                document.getElementById("listSection").style.display = "none";
            } else {
                document.querySelectorAll(".tab-btn")[1].classList.add("active");
                document.getElementById("cardsSection").style.display = "none";
                document.getElementById("listSection").style.display = "block";
                renderList();
            }
        }

        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            filteredData = vocabData.filter(item => 
                item.hanzi.includes(query) || item.meaning.toLowerCase().includes(query) || item.explanation.toLowerCase().includes(query)
            );
            currentIndex = 0;
            updateCardView();
            renderList();
        }

        updateCardView();
    </script>
</body>
</html>
